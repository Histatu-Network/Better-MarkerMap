plugins {
    id 'java'
}

group = 'com.gillodaby'

tasks.named('jar') {
    archiveBaseName.set('BetterMarkerMap')
}

// Ensure plugin metadata files are included at the root of the plugin JAR.
tasks.named('jar') {
    if (file('plugin.json').exists()) {
        from('plugin.json') { into '' }
    }
    if (file('manifest.json').exists()) {
        from('manifest.json') { into '' }
    }
    // The ownership notice travels with the artifact, at the jar root.
    from('LICENSE') { into '' }
    from('OWNERSHIP.md') { into '' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Xlint:removal']
}

repositories {
    maven { url = 'https://maven.hytale.com/release' }
    mavenCentral()
}

dependencies {
    compileOnly 'com.hypixel.hytale:Server:0.6.2'
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources/Common/UI/WorldMap/MapMarkers') {
        include '*.png'
        into 'Common/UI/Custom/Textures/BetterMarkerMap/MapMarkers'
    }
}

// --- Release line: one version, and a build identity from CI ---------------
// The version lives in gradle.properties and nowhere else. Gradle reads it
// from there on its own, and manifest.json is filled in from it below, so the
// number on the file and the number the server reads cannot drift apart.
//
// CI passes -PbuildNumber and -PcommitHash, which are appended as semver
// build metadata: 1.2.3+57.a1b2c3d. The server ignores build metadata in every
// version comparison it makes, so this says exactly which build a file came
// from without changing what the version means to any dependency range.
// A local build passes neither and is completely unchanged by this.
def releaseBuild = findProperty('buildNumber')
if (releaseBuild) {
    def releaseCommit = findProperty('commitHash')
    def suffix = releaseCommit ? "${releaseBuild}.${releaseCommit.toString().take(7)}" : "${releaseBuild}"
    version = "${version}+${suffix}".toString()
}

tasks.named('jar') {
    filteringCharset = 'UTF-8'
    inputs.property('pluginVersion', project.version.toString())
    filesMatching('manifest.json') {
        expand(version: project.version.toString())
    }
}
