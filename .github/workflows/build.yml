# Build this plugin on every push, so a broken build is noticed here rather
# than when somebody tries to deploy it.
#
# This workflow can only read. It has no credentials for any server, and it is
# not permitted to publish or release anything — those are separate decisions.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, deliberately. A workflow in any one repository must never be
# a route to anything outside it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon assemble

      - uses: actions/upload-artifact@v4
        with:
          # The commit is in the name so an artifact can always be traced back
          # to what produced it.
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          # Several shapes, because this organisation has several. A plain
          # project puts its jar in build/libs; a multi-module one puts it in
          # <module>/build/libs, which is why these are globbed rather than
          # named; and a Gradle-built asset pack produces a zip under
          # build/dist. Assuming the first shape meant AdminPortals and
          # Histatu-SalvagerBooster both built perfectly and then failed on the
          # upload, having produced an artifact this was not looking for.
          path: |
            **/build/libs/*.jar
            **/build/dist/*.zip
          # A build that produces nothing is a failure. Without this it uploads
          # nothing, passes green, and nobody looks at it again.
          if-no-files-found: error
          retention-days: 30
